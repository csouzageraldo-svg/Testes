<style>
/* Layout: uma coluna de app de bolso — mapa do corpo (7 dias) → briefing → aula no formato CrossFit. Cores dos grupos = código das anilhas bumper. */
:root {
  --bg: #e9ece8;        /* giz no piso de borracha */
  --surface: #ffffff;
  --ink: #18201d;
  --muted: #5d6965;
  --line: #d3d9d4;
  --soft: #f3f5f2;
  --core: #c99410;      /* anilha amarela 15 kg */
  --sup: #2a62c9;       /* anilha azul 20 kg */
  --pernas: #cc3d31;    /* anilha vermelha 25 kg */
  --cardio: #24884f;    /* anilha verde 10 kg */
  --btn: #18201d;
  --btn-fg: #f6f7f5;
  --warn-bg: #fff3d6;
  --warn-fg: #6b4a00;
  --fig: #18201d;
  --fig-far: #a6b0ab;
  --prop: #5d6965;
  --arrow: #cc3d31;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e8ece8; --muted: #9aa69f; --line: #2c3430; --soft: #222925;
    --core: #e5b23a; --sup: #5b8ff0; --pernas: #ec6a5c; --cardio: #45b874;
    --btn: #e8ece8; --btn-fg: #111513; --warn-bg: #3a3014; --warn-fg: #f3d58a;
    --fig: #eef1ee; --fig-far: #5f6a65; --prop: #9aa69f; --arrow: #ff7d6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e8ece8; --muted: #9aa69f; --line: #2c3430; --soft: #222925;
  --core: #e5b23a; --sup: #5b8ff0; --pernas: #ec6a5c; --cardio: #45b874;
  --btn: #e8ece8; --btn-fg: #111513; --warn-bg: #3a3014; --warn-fg: #f3d58a;
  --fig: #eef1ee; --fig-far: #5f6a65; --prop: #9aa69f; --arrow: #ff7d6e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.05; text-transform: uppercase; }
h2 { font-size: 22px; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sup); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 500; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn { border: 0; border-radius: 12px; padding: 15px 18px; background: var(--btn); color: var(--btn-fg); font: 700 19px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; width: 100%; text-align: center; text-decoration: none; display: inline-block; }
.btn.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { width: auto; padding: 11px 22px; font-size: 17px; }
.btn:disabled { opacity: .45; cursor: default; }
.ghost { background: none; border: 0; color: var(--muted); padding: 6px 8px; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-weight: 600; font-size: 14px; }
input[type="date"], input[type="text"], input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--soft); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 90px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs a { text-align: center; padding: 14px 4px; font: 700 16px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-decoration: none; }
nav.tabs a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--ink); }

/* Mapa do corpo */
.balance { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
.bars { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bar { display: flex; flex-direction: column; gap: 4px; }
.bar .lab { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
.bar .lab span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.track { position: relative; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.suggest { border-left: 6px solid var(--core); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }
.suggest strong { font: 800 26px/1.05 var(--display); text-transform: uppercase; }
.recent { display: flex; flex-direction: column; gap: 6px; }
.recent .r { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 14px; align-items: baseline; }
.recent .r .d { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Aula */
.part { display: flex; align-items: baseline; gap: 10px; }
.part .tag { font: 800 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--surface); padding: 5px 8px; border-radius: 6px; }
.clock { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-block: 1px solid var(--line); }
.clock .time { font: 800 64px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.ex { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ex.now { outline: 3px solid var(--ink); }
.steps { display: grid; gap: 1px; background: var(--line); }
.steps.c1 { grid-template-columns: 1fr; }
.steps.c2 { grid-template-columns: 1fr 1fr; }
.steps.c3 { grid-template-columns: 1fr 1fr 1fr; }
.step { background: var(--soft); display: flex; flex-direction: column; min-width: 0; }
.media { background: var(--soft); }
.stage3d { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; background: radial-gradient(ellipse at 50% 85%, var(--surface) 0%, var(--soft) 70%); }
.mtoggle { width: max-content; margin: 8px 8px 0 auto; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.mtoggle button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1 var(--body); padding: 7px 11px; border-radius: 999px; }
.mtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.step { margin: 0; }
.step img { width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: var(--soft); }
.step .cap { display: flex; gap: 6px; padding: 6px 8px 8px; font-size: 13px; line-height: 1.3; }
.step .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 700 13px/20px var(--display); text-align: center; }
.ex .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.ex .qty { font: 800 28px/1 var(--display); }
.ex .name { font: 700 22px/1.1 var(--display); text-transform: uppercase; }
.ex ul { margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: 15px; }
.last { font-size: 14px; font-weight: 600; color: var(--sup); }
.mini { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.mini:first-of-type { border-top: 0; }
.mini .thumb { width: 112px; background: var(--soft); border-radius: 8px; overflow: hidden; }
.mini .thumb img { width: 100%; height: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
.mini b { display: block; font-size: 16px; }
.gtag { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; color: #fff; display: inline-block; }
.done-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.res { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; }
.res span { font-size: 15px; min-width: 0; }

.hist { display: flex; flex-direction: column; }
.hist .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hist .item:first-child { border-top: 0; }
.hist .item .t { font-weight: 600; min-width: 0; }
.hist .item .d { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.hist .item .x { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.links a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
.links li { padding: 4px 0; }
@media (max-width: 380px) { .balance { grid-template-columns: 1fr; justify-items: center; } .balance .bars { width: 100%; } }
</style>

<script>

const IMG = (k) => `img/${k}.jpg`;
function mediaHTML(id) {
  const anim = M3.ok && FIG[id] && M3.mode === "anim";
  return `<div class="media">
    ${M3.ok && FIG[id] ? `<div class="mtoggle" role="group" aria-label="Ver como"><button data-act="view" data-mode="anim" aria-pressed="${anim}">Animação</button><button data-act="view" data-mode="foto" aria-pressed="${!anim}">Fotos</button></div>` : ""}

function stepsHTML(id) {

  return `<div class="steps ${cols}">${ph.map(([k, cap], i) => `<figure class="step"><img src="${IMG(k)}" alt="${esc(cap)}" loading="lazy" width="600" height="400"><figcaption class="cap"><span class="n">${i + 1}</span><span>${esc(cap)}</span></figcaption></figure>`).join("")}</div>`;

const L = { torso: 50, ua: 27, la: 25, th: 38, sh: 38, head: 11 };

  const { estado, local } = brief, T = brief.tempo;
  const tired = estado === "cansado", factor = tired ? 0.7 : 1;
  const used = new Set();
  const avoidJump = tired || LOCAIS[local].quiet;
  const ok = (e) => usable(e, local) && !(avoidJump && e.jump);
  const pickN = (arr, n) => arr.map((x) => [x, r()]).sort((a, b) => a[1] - b[1]).slice(0, n).map((x) => x[0]);
  const coolOf = (n) => pickN(Object.values(LIB).filter((e) => e.cool && usable(e, local) && !used.has(e.id)), n).map((e) => item(e, local));
  const last2 = sorted().slice(0, 2);
  const considered = last2.length ? `Considerei seus últimos treinos: ${last2.map((w) => `${esc(w.titulo || "treino")} (${fmtDate(w.data)})`).join(" e ")}.` : "";

  if (estado === "dor") {
    const ids = ["cat_cow", "inchworm", "glute_bridge", "dead_bug", "march"].filter((id) => usable(LIB[id], local));
    return {
      seed, foco: "recuperacao", titulo: "Recuperação leve", local, tempo: 20, why: "Você marcou dor ou mal-estar: hoje é movimento leve.",
      aviso: "Com febre, dor no peito, falta de ar fora do normal ou tontura, não treine e procure atendimento.",
      partes: [
        { tipo: "wod", nome: "Circuito leve · 15 min", formato: "flow", min: 15, regra: "2 a 3 voltas sem pressa, respirando pelo nariz.", itens: ids.map((id) => item(LIB[id], local, { factor: 0.7 })) },
        { tipo: "cool", nome: "Volta à calma · 3 min", itens: coolOf(2) },
      ],
    };
  }
  const a = alloc(T), partes = [];

  // 1) Aquecimento: geral (cardio) + específico (movimentos leves)
  const warmCardio = pickN(Object.values(LIB).filter((e) => e.warm && e.g === "cardio" && usable(e, local)), 1);
  const warmSpec = pickN(Object.values(LIB).filter((e) => e.warm && e.g !== "cardio" && usable(e, local)), 2);
  for (const e of [...warmCardio, ...warmSpec]) used.add(e.id);
  partes.push({ tipo: "warm", nome: `Aquecimento · ${a.warm} min`, regra: "Geral + específico: 2 voltas tranquilas.", itens: [...warmCardio, ...warmSpec].map((e) => item(e, local, { factor: 0.7 })) });

  // 2) Força ou Skill
  if (a.strength) {
    const sFoco = foco === "core" || foco === "cardio" ? "sup" : foco === "corpo" ? (r() < 0.5 ? "pernas" : "sup") : foco;
    const lift = choose((e) => e.strength && ok(e), (e) => relevance(e, sFoco) + (e.load ? 0.3 : 0), used, r);
    if (lift) {
      const weighted = lift.load && usable(lift, local).length;
      const scheme = weighted ? (sFoco === "pernas" ? { sets: 5, reps: 5, rest: 120 } : { sets: 4, reps: 8, rest: 90 }) : { sets: 4, reps: tired ? 6 : 8, rest: 60 };
      const sets = Math.max(3, Math.min(6, Math.round((a.strength * 60) / (scheme.reps * lift.sec + scheme.rest))));
      partes.push({
        tipo: "strength", nome: `${weighted ? "Força" : "Skill"} · ${a.strength} min`, formato: "sets",
        regra: weighted ? `${sets} séries de ${scheme.reps} · descanso ${scheme.rest}s. Suba a carga a cada série até ficar pesada com boa técnica.` : `${sets} séries de ${scheme.reps}, descendo em 3 segundos · descanso ${scheme.rest}s.`,
        itens: [item(lift, local, { reps: `${sets}×${scheme.reps}` })], peso: weighted,
      });
    } else a.wod += a.strength;
  }

  // 3) WOD: mistura cardio (M) + ginástica (G) + levantamento (W)
  const fmtOpts = foco === "cardio" ? ["intervalos", "fortime"] : foco === "core" ? ["emom", "amrap"] : ["amrap", "fortime", "emom"];
  const fmt = fmtOpts[Math.floor(r() * fmtOpts.length)];
  const slots = fmt === "fortime" && a.wod <= 12 ? ["W", "G"] : fmt === "emom" ? ["G", "W", "M", "G"].slice(0, a.wod >= 16 ? 4 : 3) : ["M", "W", "G"];
  const moves = [], pats = new Set();
  const wodOk = (x) => ok(x) && !ISOLATED.has(x.id) && !pats.has(PAT[x.id]);
  for (const m of slots) {
    const e = choose((x) => wodOk(x) && (x.m === m || (m === "M" && x.g === "cardio")), (x) => relevance(x, foco) + (foco !== "cardio" && m === "M" ? 0.4 : 0), used, r)
      || choose((x) => wodOk(x), (x) => relevance(x, foco), used, r);
    if (e) { moves.push(e); pats.add(PAT[e.id]); }
  }
  const work = tired ? 30 : 40;
  let wod;
  if (fmt === "emom") {
    const min = a.wod - (a.wod % moves.length);
    wod = { nome: `EMOM ${min} min`, formato: "emom", min, regra: `A cada minuto, um exercício (${moves.length} em rodízio). O que sobrar do minuto é descanso.`, itens: moves.map((e) => item(e, local, { factor, workSec: work })) };
  } else if (fmt === "intervalos") {
    const rounds = a.wod;
    wod = { nome: `${rounds} rounds · 40s/20s`, formato: "intervalos", min: rounds, work: 40, rest: 20, regra: "40 segundos forte, 20 de descanso, trocando de exercício a cada round. Conte o total de repetições.", itens: moves.map((e) => item(e, local, { factor, workSec: 40 })) };
  } else if (fmt === "fortime" && moves.length === 2) {
    wod = { nome: `21-15-9 for time · cap ${a.wod} min`, formato: "fortime", min: a.wod, regra: "Rodadas de 21, 15 e 9 repetições de cada exercício, o mais rápido possível. Pare o relógio ao terminar.", itens: moves.map((e) => item(e, local, { reps: e.unit === "s" ? "45s" : "21-15-9" })) };
  } else if (fmt === "fortime") {
    const its = moves.map((e) => item(e, local, { factor }));
    const per = moves.reduce((s, e, i) => s + (e.unit === "s" ? parseInt(its[i].qty) : parseInt(its[i].qty) * e.sec) + 10, 0);
    const rounds = Math.max(2, Math.min(8, Math.floor((a.wod * 60 * 0.85) / per)));
    wod = { nome: `${rounds} rounds for time · cap ${a.wod} min`, formato: "fortime", min: a.wod, regra: `${rounds} voltas completas o mais rápido possível. Pare o relógio ao terminar.`, itens: its };
  } else {
    wod = { nome: `AMRAP ${a.wod} min`, formato: "amrap", min: a.wod, regra: "Máximo de voltas possível com boa técnica. Anote voltas + repetições.", itens: moves.map((e) => item(e, local, { factor })) };
  }
  partes.push(Object.assign({ tipo: "wod" }, wod));

  // 4) Core (aulas de 40 min ou mais)
  if (a.core) {
    const cm = [];
    const cp = new Set();
    for (let i = 0; i < 3; i++) { const e = choose((x) => x.g === "core" && x.m === "G" && ok(x) && !cp.has(PAT[x.id]), (x) => relevance(x, "core"), used, r); if (e) { cm.push(e); cp.add(PAT[e.id]); } }
    if (cm.length) partes.push({ tipo: "core", nome: `Core · ${a.core} min`, regra: `${a.core >= 10 ? 4 : 3} voltas, 30s de descanso entre elas.`, itens: cm.map((e) => item(e, local, { factor })) });
  }
  // 5) Volta à calma
  partes.push({ tipo: "cool", nome: `Volta à calma · ${a.cool} min`, itens: coolOf(2) });

  const why = (brief.foco === "sugerido" ? sug.why : foco !== sug.foco ? `Você escolheu ${FOCOS[foco].toLowerCase()} (a sugestão era ${FOCOS[sug.foco].toLowerCase()}).` : sug.why) + (considered ? " " + considered : "");
  return { seed, foco, titulo: `${FOCOS[foco]} · ${T} min`, local, tempo: T, why, aviso: tired ? "Cansado: menos repetições e nada de saltos hoje." : "", partes };
}
function swapMove(plan, pi, ii) {
  const part = plan.partes[pi], cur = LIB[part.itens[ii].id];
  const usedIds = new Set(plan.partes.flatMap((x) => x.itens.map((i) => i.id)));
  const cands = Object.values(LIB).filter((e) => e.g !== "mob" && !usedIds.has(e.id) && usable(e, plan.local) && (part.tipo === "strength" ? e.strength : e.m === cur.m || e.g === cur.g));
  if (!cands.length) return;
  const e = cands[Math.floor(Math.random() * cands.length)];
  const old = part.itens[ii];
  part.itens[ii] = item(e, plan.local, part.tipo === "strength" || part.formato === "fortime" ? { reps: old.qty } : part.formato === "emom" || part.formato === "intervalos" ? { workSec: 40 } : {});
}

async function initCapabilities() {
  try {
    const db = window.claude ? await window.claude.use("db") : null;
    if (db) {
      S.db = db;
      db.collection("treinos").onSnapshot((snap) => { S.workouts = snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())); render(); },
        () => { S.db = null; loadLocal(); render(); });
    } else { loadLocal(); render(); }
  } catch { loadLocal(); render(); }
  try {
    const sample = window.claude ? await window.claude.use("sample") : null;
    if (sample) { S.sample = sample; const lim = await sample.limits().catch(() => null); S.canImages = !!lim?.images; render(); }
  } catch { /* sem Claude na página */ }
}
function loadLocal() { S.workouts = LS.get("cg.local.treinos", []); }
async function saveWorkout(w) {
  w.criadoEm = new Date().toISOString();
  if (S.db) {
    try { await S.db.collection("treinos").add(w); return true; }
    catch (e) { S.msg = e?.code === "quota_exceeded" ? "Limite de registros atingido." : "Não consegui salvar agora. Tente de novo em instantes."; render(); return false; }
  }
  const list = LS.get("cg.local.treinos", []); w._id = "l" + Date.now(); list.push(w); LS.set("cg.local.treinos", list); S.workouts = list; return true;
}
async function deleteWorkout(id) {
  if (S.db) { try { await S.db.collection("treinos").doc(id).delete(); } catch { S.msg = "Não consegui apagar agora."; } }
  else { const list = LS.get("cg.local.treinos", []).filter((w) => w._id !== id); LS.set("cg.local.treinos", list); S.workouts = list; }
  render();
}

function exCard(it, pi, ii, current) {

function miniRow(it) {
  const e = LIB[it.id], ph = PH[it.id] || [];
  return `<div class="mini"><div class="thumb">${ph[0] ? `<img src="${IMG(ph[ph.length > 1 ? 1 : 0][0])}" alt="${esc(e.pt)}" loading="lazy">` : ""}</div><div><b>${esc(e.pt)}</b><span class="small muted">${esc(it.qty)}${it.impl ? " · " + esc(it.impl) : ""} · ${esc(ph.map((x) => x[1]).join(" → "))}</span></div></div>`;

const mmss = (s) => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function elapsed() { const T = S.timer; return T.start ? ((T.stoppedAt || T.pausedAt || Date.now()) - T.start - T.paused) / 1000 : 0; }
function clockState(b) {
  const el = elapsed(), total = b.min * 60;
  if (b.formato === "emom") { const m = Math.floor(el / 60); return { txt: mmss(el >= total ? 0 : 60 - (el % 60)), sub: el >= total ? "Fim do WOD" : `Minuto ${m + 1} de ${b.min}`, cur: m % b.itens.length }; }
  if (b.formato === "intervalos") { const seg = b.work + b.rest, i = Math.floor(el / seg), inS = el % seg, w = inS < b.work; return { txt: mmss(w ? b.work - inS : seg - inS), sub: i >= b.min ? "Fim do WOD" : `${w ? "Forte" : "Descanso"} · round ${i + 1} de ${b.min}`, cur: i % b.itens.length }; }
  if (b.formato === "fortime") return { txt: mmss(Math.min(el, total)), sub: S.timer.stoppedAt ? "Tempo final" : el >= total ? "Time cap" : `Cap ${b.min} min`, cur: -1 };
  return { txt: mmss(total - el), sub: el >= total ? "Fim do WOD" : "Tempo restante", cur: -1 };
}
const TAG = { warm: "Aquecimento", strength: "Força", wod: "WOD", core: "Core", cool: "Calma" };
function regField(id, label, ph, type = "text") {
  return `<label class="res"><span>${esc(label)}</span><input type="${type}" ${type === "number" ? 'inputmode="decimal" step="0.5" min="0"' : ""} data-reg="${id}" value="${esc(S.reg[id] ?? "")}" placeholder="${esc(ph)}"></label>`;
}
function renderTreino() {

  const wodIdx = p.partes.findIndex((x) => x.tipo === "wod");

    ${loadItems.map((i) => regField("kg_" + i.id, `${LIB[i.id].pt} (kg)`, lastLoad(i.id) ? `última: ${lastLoad(i.id).kg}` : "kg", "number")).join("")}
    ${regField("duracao", "Duração total (min)", String(p.tempo), "number")}
    ${regField("nota", "Observação", "opcional")}
    <span class="lbl">Como foi o esforço?</span>
    <div class="done-pick">${[["leve", "Leve"], ["bom", "Na medida"], ["puxado", "Puxado"]].map(([v, l]) => `<button class="btn secondary" data-act="concluir" data-val="${v}">${l}</button>`).join("")}</div>
    <button class="ghost" data-act="outro">Gerar outro treino com as mesmas escolhas</button>
  </section>`;
}
const reconHTML = (ms) => "Reconhecidos: " + (ms.length ? ms.map((m) => `<span class="gtag" style="background:var(--muted);margin:2px">${esc(LIB[m]?.pt || m.replace(/_/g, " "))}</span>`).join("") : '<span class="muted">nenhum ainda</span>');
function renderHistorico() {
  const list = sorted(), d = S.draft;
  const addPanel = !S.addMode ? `
    <div class="row">${S.sample && S.canImages ? `<label class="btn" style="flex:1;cursor:pointer">Foto do treino do box<input type="file" id="foto" accept="image/*" hidden></label>` : ""}
    <button class="btn secondary" style="flex:1" data-act="add-manual">Digitar treino</button></div>
    <p class="small muted">${S.sample && S.canImages ? "Mande o print do app do box ou a foto do quadro: o Claude lê e você confirma." : "Escreva os exercícios; o app reconhece os nomes."}</p>`
    : `
    ${S.busy ? `<p class="muted">Lendo a imagem…</p>` : ""}
    <div class="grid2"><div class="field"><label for="d-data">Data</label><input type="date" id="d-data" value="${esc(d.data)}"></div>
    <div class="field"><label for="d-dur">Duração (min)</label><input type="number" id="d-dur" min="1" value="${esc(d.duracao || "")}" placeholder="ex.: 60"></div></div>
    <div class="field"><label for="d-titulo">Nome do treino</label><input type="text" id="d-titulo" value="${esc(d.titulo)}" placeholder="Ex.: Bugs Bunny"></div>
    <div class="field"><label for="d-texto">Exercícios</label><textarea id="d-texto" placeholder="Ex.: 21-15-9 thrusters, pull-ups, 400m run">${esc(d.texto)}</textarea></div>
    <p class="small" id="d-recon">${reconHTML(d.movimentos)}</p>
    <div class="grid2"><div class="field"><label for="d-res">Resultado (tempo ou voltas)</label><input type="text" id="d-res" value="${esc(d.resultado || "")}" placeholder="ex.: 14:32"></div>
    <div class="field"><label for="d-cargas">Pesos usados</label><input type="text" id="d-cargas" value="${esc(d.cargasTexto || "")}" placeholder="ex.: thruster 20 kg"></div></div>
    <div class="row"><button class="btn" style="flex:1" id="d-save" data-act="salvar-draft" ${d.movimentos.length ? "" : "disabled"}>Salvar</button><button class="btn secondary" style="flex:1" data-act="cancelar-draft">Cancelar</button></div>`;
  const extra = (w) => {
    const bits = [];
    if (w.duracaoMin) bits.push(`${w.duracaoMin} min`);
    for (const r of w.resultados || []) if (r.valor) bits.push(`${r.bloco}: ${r.valor}`);
    if (w.resultado) bits.push(w.resultado);
    if (w.cargas) for (const [id, kg] of Object.entries(w.cargas)) bits.push(`${LIB[id]?.pt || id} ${kg} kg`);
    if (w.cargasTexto) bits.push(w.cargasTexto);
    return bits.length ? `<span class="x">${esc(bits.join(" · "))}</span>` : "";
  };
  return `
  <header><h1>Histórico</h1><p class="muted small" style="margin-top:6px">Treinos do box, de casa e de viagem. Quanto mais você registra, melhor fica a sugestão.</p></header>
  ${S.msg ? `<div class="notice">${esc(S.msg)}</div>` : ""}
  <section class="panel"><h2>Adicionar treino</h2>${addPanel}</section>
  <section class="panel"><div class="row between"><h2>Registrados</h2><span class="small muted">${list.length}</span></div>
    ${list.length ? `<div class="hist">${list.map((w) => `<div class="item"><span class="t">${esc(w.titulo || "Treino")}</span><span class="d">${fmtDate(w.data)}</span>
        <span class="row">${gTags(w)}<span class="small muted">${w.origem === "box" ? "box" : w.origem === "app" ? "app" : "manual"}${w.esforco ? " · " + esc(w.esforco) : ""}</span></span>
        <span>${S.confirmDel === w._id ? `<button class="ghost" style="color:var(--pernas)" data-act="del-ok" data-id="${w._id}">Confirmar</button>` : `<button class="ghost" data-act="del" data-id="${w._id}">Apagar</button>`}</span>${extra(w)}</div>`).join("")}</div>`
      : `<p class="muted">Nenhum treino ainda. Adicione o último treino do box acima.</p>`}
  </section>
  <section class="panel links"><h2>CrossFit oficial</h2>
    <ul style="margin:0;padding-left:18px">
      <li><a href="https://www.crossfit.com/workout/" target="_blank" rel="noopener">WOD do dia (crossfit.com)</a></li>
      <li><a href="https://games.crossfit.com/open/schedule" target="_blank" rel="noopener">Calendário do Open</a></li>
      <li><a href="https://games.crossfit.com/competitions" target="_blank" rel="noopener">Eventos oficiais</a></li>
      <li><a href="https://www.crossfit.com/crossfit-movements" target="_blank" rel="noopener">Biblioteca de movimentos</a></li>
      <li><a href="https://www.crossfit.com/crossfit-methodology" target="_blank" rel="noopener">Metodologia</a></li>
    </ul>
    <p class="small muted">Datas de competições mudam a cada temporada: confira sempre na fonte oficial. App pessoal, sem vínculo com a CrossFit.</p>
    <p class="small muted">Fotos dos exercícios: Free Exercise DB (domínio público). Algumas fotos usam outro equipamento (kettlebell, polia); a legenda indica como fazer em casa.</p>
  </section>`;
}
function render() {
  const v = view();
  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === v ? "page" : "false"));
  app.innerHTML = v === "treino" ? renderTreino() : v === "historico" ? renderHistorico() : renderHoje();
  const f = document.getElementById("foto");
  if (f) f.addEventListener("change", () => readPhoto(f.files[0]));
  const tx = document.getElementById("d-texto");
  if (tx) tx.addEventListener("input", () => {
    S.draft.texto = tx.value; S.draft.movimentos = movesFromText(tx.value + " " + (S.draft.titulo || ""));
    document.getElementById("d-recon").innerHTML = reconHTML(S.draft.movimentos);
    document.getElementById("d-save").disabled = !S.draft.movimentos.length;
  });
  if (M3.ok) app.querySelectorAll("canvas.stage3d").forEach((c) => M3.observe(c));
  highlightCurrent();
}

/* ============================== AÇÕES ============================== */
function persist() { LS.set("cg.brief", S.brief); LS.set("cg.plan2", S.plan); LS.set("cg.timer2", S.timer); LS.set("cg.reg", S.reg); }
function captureDraft() {
  if (!S.draft) return;
  const g = (id) => document.getElementById(id)?.value;
  if (g("d-data") !== undefined) S.draft.data = g("d-data") || todayISO();
  for (const [id, k] of [["d-titulo", "titulo"], ["d-dur", "duracao"], ["d-res", "resultado"], ["d-cargas", "cargasTexto"]]) if (g(id) !== undefined) S.draft[k] = g(id);
}
async function readPhoto(file) {
  if (!file || !S.sample) return;
  S.addMode = "foto"; S.draft = { data: todayISO(), titulo: "", texto: "", movimentos: [] }; S.busy = true; S.msg = ""; render();
  try {
    const r = await S.sample.json(
      `A imagem é um print do app de um box de CrossFit ou a foto de um quadro com o treino do dia.
Extraia o treino e responda só com JSON: {"data":"AAAA-MM-DD ou vazio","titulo":"nome do WOD ou vazio","texto":"o treino em texto simples, uma linha por exercício, com reps e cargas"}.
Use os nomes dos exercícios em inglês como aparecem (deadlift, thruster, pull-up, toes-to-bar, wall ball, double under, run, row, snatch, clean...). Hoje é ${todayISO()}; se a data não tiver ano, use o ano mais próximo de hoje.`,
      { images: [file] });
    S.draft.data = /^\d{4}-\d{2}-\d{2}$/.test(r?.data || "") ? r.data : todayISO();
    S.draft.titulo = String(r?.titulo || "");
    S.draft.texto = String(r?.texto || "");
    S.draft.movimentos = movesFromText(S.draft.texto + " " + S.draft.titulo);
    if (!S.draft.movimentos.length) S.msg = "Não reconheci exercícios na imagem. Confira o texto e ajuste.";
  } catch (e) {
    S.msg = e?.code === "not_granted" || e?.code === "sampling_disabled" ? "Leitura de imagem não autorizada. Digite o treino." : e?.code === "rate_limited" ? "Muitas leituras seguidas. Tente em alguns minutos ou digite o treino." : "Não consegui ler a imagem. Digite o treino.";
  }
  S.busy = false; render();
}
function newPlan() {
  S.plan = generate(S.brief, Math.floor(Math.random() * 1e9));
  S.timer = { start: null, paused: 0, pausedAt: null, stoppedAt: null }; S.reg = {}; persist();
}
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.val;
    if (k === "tempo") { if (v === "livre") { S.brief.livre = true; } else { S.brief.livre = false; S.brief.tempo = Number(v); } }
    else S.brief[k] = v;
    persist(); render(); return;
  }
  const act = t.dataset.act;
  if (act === "gerar" || act === "outro") { newPlan(); if (location.hash !== "#treino") location.hash = "treino"; else { render(); scrollTo(0, 0); } return; }
  if (act === "view") { M3.mode = t.dataset.mode; LS.set("cg.media", M3.mode); render(); return; }
  if (act === "trocar") { swapMove(S.plan, +t.dataset.p, +t.dataset.i); persist(); render(); return; }
  if (act === "start") { S.timer = { start: Date.now(), paused: 0, pausedAt: null, stoppedAt: null }; persist(); render(); try { await navigator.wakeLock?.request("screen"); } catch { /* opcional */ } return; }
  if (act === "pause") { S.timer.pausedAt = Date.now(); persist(); render(); return; }
  if (act === "resume") { S.timer.paused += Date.now() - S.timer.pausedAt; S.timer.pausedAt = null; persist(); render(); return; }
  if (act === "stop") { S.timer.stoppedAt = Date.now(); S.reg.wod = mmss(elapsed()); persist(); render(); document.getElementById("registro")?.scrollIntoView({ behavior: "smooth" }); return; }
  if (act === "reset") { S.timer = { start: null, paused: 0, pausedAt: null, stoppedAt: null }; persist(); render(); return; }
  if (act === "concluir") {
    const p = S.plan, moves = [...new Set(p.partes.filter((x) => x.tipo !== "warm" && x.tipo !== "cool").flatMap((x) => x.itens.map((i) => i.id)))];
    const cargas = {};
    for (const [k, v] of Object.entries(S.reg)) if (k.startsWith("kg_") && Number(v) > 0) cargas[k.slice(3)] = Number(v);
    const strength = p.partes.find((x) => x.tipo === "strength");
    if (strength && Number(S.reg.forca) > 0) cargas[strength.itens[0].id] = Number(S.reg.forca);
    const wod = p.partes.find((x) => x.tipo === "wod");
    const resultados = [];
    if (strength && S.reg.forca) resultados.push({ bloco: "Força", valor: `${S.reg.forca} kg` });
    if (wod && S.reg.wod) resultados.push({ bloco: wod.nome.split(" · ")[0], valor: S.reg.wod });
    const doc = { data: todayISO(), titulo: p.titulo, origem: "app", local: p.local, foco: p.foco, movimentos: moves, grupos: groupsOf(moves), esforco: t.dataset.val,
      duracaoMin: Number(S.reg.duracao) || p.tempo, resultados, cargas };
    if (S.reg.nota) doc.nota = String(S.reg.nota).slice(0, 500);
    const ok = await saveWorkout(doc);
    if (ok) { S.plan = null; S.reg = {}; S.timer = { start: null, paused: 0, pausedAt: null, stoppedAt: null }; persist(); S.msg = "Treino salvo. O mapa do corpo e as cargas já foram atualizados."; location.hash = "historico"; render(); }
    return;
  }
  if (act === "add-manual") { S.addMode = "manual"; S.draft = { data: todayISO(), titulo: "", texto: "", movimentos: [] }; S.msg = ""; render(); return; }
  if (act === "cancelar-draft") { S.addMode = null; S.draft = null; render(); return; }
  if (act === "salvar-draft") {
    captureDraft();
    const d = S.draft;
    const doc = { data: d.data, titulo: d.titulo || "Treino do box", origem: S.addMode === "foto" ? "box" : "manual", movimentos: d.movimentos, grupos: groupsOf(d.movimentos), texto: (d.texto || "").slice(0, 2000) };
    if (Number(d.duracao) > 0) doc.duracaoMin = Number(d.duracao);
    if (d.resultado) doc.resultado = d.resultado.slice(0, 200);
    if (d.cargasTexto) doc.cargasTexto = d.cargasTexto.slice(0, 300);
    const ok = await saveWorkout(doc);
    if (ok) { S.addMode = null; S.draft = null; S.msg = "Treino adicionado. A sugestão de hoje já considera ele."; render(); }
    return;
  }
  if (act === "del") { S.confirmDel = t.dataset.id; render(); return; }
  if (act === "del-ok") { S.confirmDel = null; await deleteWorkout(t.dataset.id); return; }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset?.reg) { S.reg[el.dataset.reg] = el.value; LS.set("cg.reg", S.reg); return; }
  if (el.id === "livre") { const v = Math.max(10, Math.min(90, Number(el.value) || 30)); S.brief.tempo = v; LS.set("cg.brief", S.brief); return; }
  if (el.id?.startsWith("d-") && el.id !== "d-texto") captureDraft();
});
function highlightCurrent() {
  if (view() !== "treino" || !S.plan?.partes) return;
  const pi = S.plan.partes.findIndex((x) => x.tipo === "wod"); if (pi < 0) return;
  const cs = clockState(S.plan.partes[pi]);
  const running = S.timer.start && !S.timer.pausedAt && !S.timer.stoppedAt;
  document.querySelectorAll(`#parte${pi} .ex`).forEach((el, i) => el.classList.toggle("now", !!running && i === cs.cur));
}
setInterval(() => {
  if (view() !== "treino" || !S.plan?.partes || !S.timer.start || S.timer.pausedAt || S.timer.stoppedAt) return;
  const b = S.plan.partes.find((x) => x.tipo === "wod"); if (!b || b.formato === "flow") return;
  const cs = clockState(b);
  const c = document.getElementById("clk"), sub = document.getElementById("clksub");
  if (c) c.textContent = cs.txt; if (sub) sub.textContent = cs.sub;
  highlightCurrent();
}, 250);
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

M3.mode = LS.get("cg.media", "anim");
init3D();
render();
initCapabilities();
window.CG = { LIB, PH, FIG, M3, generate, S };
</script>
