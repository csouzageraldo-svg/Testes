<style>
/* Layout: uma coluna de app de bolso — mapa do corpo (7 dias) → briefing → aula no formato CrossFit. Cores dos grupos = código das anilhas bumper. */
:root {
  --bg: #e9ece8;        /* giz no piso de borracha */
  --surface: #ffffff;
  --ink: #18201d;
  --muted: #5d6965;
  --line: #d3d9d4;
  --soft: #f3f5f2;
  --core: #c99410;      /* anilha amarela 15 kg */
  --sup: #2a62c9;       /* anilha azul 20 kg */
  --pernas: #cc3d31;    /* anilha vermelha 25 kg */
  --cardio: #24884f;    /* anilha verde 10 kg */
  --btn: #18201d;
  --btn-fg: #f6f7f5;
  --warn-bg: #fff3d6;
  --warn-fg: #6b4a00;
  --fig: #18201d;
  --fig-far: #a6b0ab;
  --prop: #5d6965;
  --arrow: #cc3d31;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e8ece8; --muted: #9aa69f; --line: #2c3430; --soft: #222925;
    --core: #e5b23a; --sup: #5b8ff0; --pernas: #ec6a5c; --cardio: #45b874;
    --btn: #e8ece8; --btn-fg: #111513; --warn-bg: #3a3014; --warn-fg: #f3d58a;
    --fig: #eef1ee; --fig-far: #5f6a65; --prop: #9aa69f; --arrow: #ff7d6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e8ece8; --muted: #9aa69f; --line: #2c3430; --soft: #222925;
  --core: #e5b23a; --sup: #5b8ff0; --pernas: #ec6a5c; --cardio: #45b874;
  --btn: #e8ece8; --btn-fg: #111513; --warn-bg: #3a3014; --warn-fg: #f3d58a;
  --fig: #eef1ee; --fig-far: #5f6a65; --prop: #9aa69f; --arrow: #ff7d6e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.05; text-transform: uppercase; }
h2 { font-size: 22px; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sup); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 500; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn { border: 0; border-radius: 12px; padding: 15px 18px; background: var(--btn); color: var(--btn-fg); font: 700 19px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; width: 100%; text-align: center; text-decoration: none; display: inline-block; }
.btn.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { width: auto; padding: 11px 22px; font-size: 17px; }
.btn:disabled { opacity: .45; cursor: default; }
.ghost { background: none; border: 0; color: var(--muted); padding: 6px 8px; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-weight: 600; font-size: 14px; }
input[type="date"], input[type="text"], input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--soft); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 90px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs a { text-align: center; padding: 14px 4px; font: 700 16px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-decoration: none; }
nav.tabs a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--ink); }

/* Mapa do corpo */
.balance { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
.bars { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bar { display: flex; flex-direction: column; gap: 4px; }
.bar .lab { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
.bar .lab span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.track { position: relative; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.recent .r .d { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Aula */
.part { display: flex; align-items: baseline; gap: 10px; }
.part .tag { font: 800 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--surface); padding: 5px 8px; border-radius: 6px; }
.clock { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-block: 1px solid var(--line); }
.clock .time { font: 800 64px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.ex { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ex.now { outline: 3px solid var(--ink); }
.steps { display: grid; gap: 1px; background: var(--line); }
.steps.c1 { grid-template-columns: 1fr; }
.steps.c2 { grid-template-columns: 1fr 1fr; }
.steps.c3 { grid-template-columns: 1fr 1fr 1fr; }
.step { background: var(--soft); display: flex; flex-direction: column; min-width: 0; }
.step svg { width: 100%; height: auto; display: block; }
.steps.c1 .step svg { max-height: 210px; }
.step .cap { display: flex; gap: 6px; padding: 6px 8px 8px; font-size: 13px; line-height: 1.3; }
.step .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 700 13px/20px var(--display); text-align: center; }
.ex .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.ex .qty { font: 800 28px/1 var(--display); }
.ex .name { font: 700 22px/1.1 var(--display); text-transform: uppercase; }
.ex ul { margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: 15px; }
.last { font-size: 14px; font-weight: 600; color: var(--sup); }
.mini { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.mini:first-of-type { border-top: 0; }
.mini .thumb { width: 96px; background: var(--soft); border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
.mini .thumb svg { width: 100%; height: auto; display: block; }
.mini b { display: block; font-size: 16px; }
.gtag { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; color: #fff; display: inline-block; }
.done-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.res { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; }
.res span { font-size: 15px; min-width: 0; }

.hist { display: flex; flex-direction: column; }
.hist .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hist .item:first-child { border-top: 0; }
.hist .item .t { font-weight: 600; min-width: 0; }
.hist .item .d { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.hist .item .x { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.links a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
.links li { padding: 4px 0; }
@media (max-width: 380px) { .balance { grid-template-columns: 1fr; justify-items: center; } .balance .bars { width: 100%; } .steps.c3 { grid-template-columns: 1fr 1fr; } }
</style>

<script>
"use strict";
/* ============================== DADOS FIXOS ============================== */
const GROUPS = {
  core:   { label: "Core",       color: "var(--core)",   target: 0.30 },
  sup:    { label: "Superiores", color: "var(--sup)",    target: 0.30 },

};
const GK = ["core", "sup", "pernas", "cardio"];
const LOCAIS = {
  casa:   { label: "Casa", eq: ["halter", "sandbag", "barra", "banco", "bike", "elastico", "kb"], quiet: false },
  sem:    { label: "Sem equipamento", eq: [], quiet: false },
  hotel:  { label: "Academia do hotel", eq: ["halter", "banco", "bike", "esteira"], quiet: false },
  quarto: { label: "Quarto", eq: [], quiet: true },
};
const EQ_LABEL = { halter: "halteres", sandbag: "sandbag", barra: "barra", banco: "banco", bike: "bike", elastico: "elástico", kb: "alça de kettlebell", esteira: "esteira" };

// Peso de cada grupo por movimento [core, superiores, pernas, fôlego]. Inclui movimentos do box fora da biblioteca de casa.
const W = {
  deadlift: [.2,.15,.65,0], hspu: [.2,.8,0,0], front_squat: [.2,.1,.7,0], snatch: [.15,.35,.4,.1], bench_press: [0,1,0,0],
  handstand: [.3,.7,0,0], kb_swing: [.25,.15,.5,.1], thruster: [.1,.35,.45,.1], burpee: [.15,.25,.25,.35], back_squat: [.15,0,.85,0],
  lunge: [.1,0,.85,.05], bulgarian: [.1,0,.9,0], clean: [.15,.3,.45,.1], wall_walk: [.35,.65,0,0], double_under: [0,.05,.25,.7],
  row: [.1,.3,.25,.35], run: [0,0,.3,.7], toes_to_bar: [.7,.3,0,0], box_jump: [0,0,.6,.4], wall_ball: [.1,.3,.4,.2],
  clean_jerk: [.15,.4,.35,.1], air_squat: [.1,0,.8,.1], step_up: [0,0,.7,.3], bike: [0,0,.3,.7], pull_up: [.15,.85,0,0],
  db_press: [.15,.85,0,0], push_up: [.2,.8,0,0], push_up_incline: [.2,.8,0,0], pike_push_up: [.2,.8,0,0], db_push_press: [.1,.65,.25,0],
  db_row: [.15,.85,0,0], band_row: [.1,.9,0,0], db_curl: [0,1,0,0], triceps_ext: [0,1,0,0], db_bench_press: [0,1,0,0],
  band_pulldown: [.1,.9,0,0], goblet_squat: [.15,.05,.8,0], glute_bridge: [.3,0,.7,0], plank: [.85,.15,0,0], side_plank: [.9,.1,0,0],
  dead_bug: [1,0,0,0], hollow_hold: [1,0,0,0], sit_up: [1,0,0,0], tuck_up: [1,0,0,0], mountain_climber: [.55,.15,0,.3],
  superman: [.8,.1,.1,0], burpee_step: [.2,.25,.25,.3], db_snatch: [.15,.35,.35,.15], sandbag_clean: [.25,.25,.4,.1],
  march: [.15,0,.25,.6], farmer_carry: [.5,.3,.2,0], jump_squat: [0,0,.7,.3], shoulder_pass: [0,.5,0,0], cat_cow: [.5,0,0,0],
  hip_hinge: [.2,0,.4,0], hamstring: [0,0,.3,0], ski: [.1,.4,.2,.3], muscle_up: [.2,.8,0,0], rope_climb: [.2,.8,0,0],
};

/* ============================== FIGURAS ============================== */
// Boneco em vista lateral; ângulos em graus: 0 = para baixo, 90 = para frente, 180 = para cima, -90 = para trás.
const L = { torso: 50, ua: 27, la: 25, th: 38, sh: 38, head: 11 };
const GROUND = 182;
const P = (o) => Object.assign({ hx: 100, torso: 180, ua: 0, la: 0, th: 0, sh: 0 }, o);
const STAND = P({}), ARMS_FWD = P({ ua: 90, la: 90 }), SQUAT = P({ torso: 145, th: 100, sh: -28, ua: 95, la: 95 });
const RACK = { ua: 100, la: -150 }, OVER = { ua: 180, la: 180 };
const PLANK_TOP = P({ torso: 115, th: -65, sh: -65 }), PLANK_LOW = P({ torso: 99, th: -81, sh: -81, ua: -100, la: 10 });
const LYING = { torso: -90, th: 90, sh: 0 }, QUAD = P({ torso: 90, th: 0, sh: -90 });
const SQ_LOW = P({ torso: 140, th: 105, sh: -35 });
// F(frames, opções). Cada frame = uma etapa ilustrada.
const F = (frames, extra) => Object.assign({ frames, anchor: "ground", props: [] }, extra || {});
const FIG = {
  march: F([P({ th: 90, sh: 0, ua: 60, la: 120, ua2: -30, la2: 20 }), P({ th2: 90, sh2: 0, ua2: 60, la2: 120, ua: -30, la: 20 })]),
  shoulder_pass: F([P({ ua: 60, la: 60 }), P(OVER), P({ ua: -60, la: -60 })], { hand: "band" }),
  cat_cow: F([P(Object.assign({}, QUAD, { bend: 14, head: 30 })), P(Object.assign({}, QUAD, { bend: -12, head: -25 }))]),
  hip_hinge: F([P({ ua: 30, la: 60 }), P({ torso: 100, th: 12, sh: -4, ua: 30, la: 60 })]),
  hamstring: F([P({ ua: 0, la: 0 }), P({ torso: 95, th: 18, sh: 0, ua: 5, la: 5 })]),
  air_squat: F([ARMS_FWD, SQUAT]),
  goblet_squat: F([P({ ua: 25, la: 165 }), P({ torso: 155, th: 100, sh: -28, ua: 50, la: 175 })], { hand: "dumbbell1" }),
  lunge: F([STAND, P({ th: 85, sh: 0, th2: -15, sh2: -95 })]),
  bulgarian: F([P({ th: 20, sh: 0, th2: -40, sh2: -95 }), P({ th: 88, sh: -5, th2: -10, sh2: -85 })], { props: ["bench_back"] }),
  deadlift: F([P({ torso: 112, th: 62, sh: -12, ua: 2, la: 2 }), P({ torso: 140, th: 25, sh: -5 }), STAND], { hand: "dumbbell" }),
  kb_swing: F([P({ torso: 105, th: 18, sh: -6, ua: -25, la: -25 }), P({ torso: 150, th: 10, sh: -2, ua: 30, la: 30 }), P({ ua: 90, la: 90 })], { hand: "kettlebell" }),
  glute_bridge: F([P({ torso: -90, th: 135, sh: 45, ua: -100, la: -100 }), P({ torso: -112, th: 108, sh: 15, ua: -100, la: -100 })]),
  jump_squat: F([SQUAT, P({ ua: 160, la: 160, lift: 25 })]),
  thruster: F([P(RACK), P(Object.assign({ torso: 160, th: 100, sh: -28 }, RACK)), P(OVER)], { hand: "dumbbell" }),
  db_snatch: F([P({ torso: 108, th: 50, sh: -10, ua: 0, la: 0, ua2: 30, la2: 60 }), P({ torso: 185, ua: 140, la: 170, ua2: 20, la2: 40 }), P(Object.assign({ ua2: 10, la2: 20 }, OVER))], { hand: "dumbbell1" }),
  sandbag_clean: F([P({ torso: 105, th: 70, sh: -15, ua: 10, la: 60 }), P({ torso: 160, th: 60, sh: -20, ua: 40, la: 150 }), P({ ua: -150, la: 30 })], { hand: "sandbag" }),
  farmer_carry: F([P({ th: 25, sh: -10, th2: -20, sh2: -20 })], { hand: "dumbbell" }),
  push_up: F([PLANK_TOP, PLANK_LOW]),
  push_up_incline: F([P({ torso: 128, th: -52, sh: -52, ua: 30, la: 30 }), P({ torso: 115, th: -65, sh: -65, ua: -80, la: 40 })], { props: ["bench_hands"] }),
  pike_push_up: F([P({ torso: 45, th: -35, sh: -35, ua: 5, la: 5 }), P({ torso: 50, th: -35, sh: -35, ua: -70, la: 30 })]),
  db_press: F([P({ ua: 60, la: 170 }), P(OVER)], { hand: "dumbbell" }),
  db_push_press: F([P({ ua: 60, la: 170 }), P({ torso: 178, th: 30, sh: -20, ua: 60, la: 170 }), P(OVER)], { hand: "dumbbell" }),
  db_row: F([P({ torso: 110, th: 25, sh: -10, ua: 0, la: 0 }), P({ torso: 110, th: 25, sh: -10, ua: -70, la: 20 })], { hand: "dumbbell" }),
  band_row: F([P({ torso: 178, th: 90, sh: 90, ua: 90, la: 90 }), P({ torso: 185, th: 90, sh: 90, ua: -30, la: 85 })], { hand: "band" }),
  band_pulldown: F([P(Object.assign({ th: 0, sh: -90 }, OVER)), P({ th: 0, sh: -90, ua: 25, la: 160 })], { hand: "band_up" }),
  db_curl: F([P({}), P({ ua: 5, la: 150 })], { hand: "dumbbell" }),
  triceps_ext: F([P({ ua: 170, la: 20 }), P(OVER)], { hand: "dumbbell" }),
  db_bench_press: F([P(Object.assign({}, LYING, { ua: 30, la: 175 })), P(Object.assign({}, LYING, OVER))], { hand: "dumbbell", props: ["bench_under"] }),
  plank: F([P({ torso: 98, th: -82, sh: -82, ua: 0, la: 90 })]),
  side_plank: F([P({ torso: 114, th: -66, sh: -66, ua: 0, la: 0, ua2: 180, la2: 180 })]),
  dead_bug: F([P(Object.assign({}, LYING, { th: 180, sh: 90 }, OVER)), P(Object.assign({}, LYING, { th: 120, sh: 115, th2: 180, sh2: 90, ua: -100, la: -100, ua2: 180, la2: 180 }))]),
  hollow_hold: F([P({ torso: -100, th: 102, sh: 102, ua: -100, la: -100, bend: 5 })]),
  sit_up: F([P({ torso: -90, th: 60, sh: -40, ua: -90, la: -90 }), P({ torso: 145, th: 60, sh: -40, ua: 120, la: 120 })]),
  tuck_up: F([P({ torso: -100, th: 102, sh: 102, ua: -100, la: -100 }), P({ torso: -140, th: 150, sh: 10, ua: 100, la: 100, bend: 8 })]),

  burpee: F([STAND, SQ_LOW, PLANK_TOP, P({ torso: 92, th: -88, sh: -88, ua: -110, la: 10 }), P(Object.assign({ lift: 20 }, OVER))]),
  burpee_step: F([SQ_LOW, P({ torso: 125, th: 90, sh: -40, th2: -55, sh2: -55 }), PLANK_TOP, STAND]),
  bike: F([P({ torso: 130, ua: 100, la: 100, th: 100, sh: 10, th2: 45, sh2: -20 })], { anchor: "seat", props: ["bike"] }),
  run: F([P({ torso: 172, th: 45, sh: -10, th2: -30, sh2: -80, ua: -40, la: 50, ua2: 40, la2: 110 })]),

const dirv = (d) => [Math.sin(d * Math.PI / 180), Math.cos(d * Math.PI / 180)];
const add = (p, d, l) => [p[0] + d[0] * l, p[1] + d[1] * l];
function skeleton(p, anchor) {
  const hip = [p.hx, 0], td = dirv(p.torso), sho = add(hip, td, L.torso);

function balance(days) {
  const sum = { core: 0, sup: 0, pernas: 0, cardio: 0 }; const used = [];
  for (const w of S.workouts) {
    const a = daysAgo(w.data); if (a < 0 || a >= days) continue;
    const g = w.grupos || groupsOf(w.movimentos || []); if (!g) continue;
    const f = (w.esforco === "leve" ? 0.6 : w.esforco === "puxado" ? 1.3 : 1) * (a <= 2 ? 1.2 : 1);
    GK.forEach((k) => sum[k] += (g[k] || 0) * f); used.push(w);
  }
  const tot = GK.reduce((a, k) => a + sum[k], 0);
  return { share: Object.fromEntries(GK.map((k) => [k, tot ? sum[k] / tot : 0])), count: used.length, used };
}
function suggestion() {
  let win = 7, b = balance(7);
  if (b.count === 0) { win = 14; b = balance(14); }
  if (!b.count) return { foco: "core", win, why: "Sem treinos registrados nas últimas 2 semanas: começamos pelo core, sua prioridade." };
  const last = sorted()[0];
  const lastG = last && (last.grupos || groupsOf(last.movimentos || []));
  const lastTop = lastG ? GK.reduce((a, k) => (lastG[k] > lastG[a] ? k : a), "core") : null;
  const recent = last && daysAgo(last.data) <= 1;
  const k = GK.map((g) => ({ g, gap: GROUPS[g].target - b.share[g] - (recent && g === lastTop ? 0.2 : 0) + (g === "core" || g === "sup" ? 0.03 : 0) }))
    .sort((x, y) => y.gap - x.gap)[0].g;
  let why = `${GROUPS[k].label}: ${Math.round(b.share[k] * 100)}% do que você treinou nos últimos ${win} dias (meta ${Math.round(GROUPS[k].target * 100)}%).`;
  if (win === 14) why = "Nenhum treino nos últimos 7 dias, então olhei 14. " + why;
  if (recent && lastTop && lastTop !== k) why += ` O último treino (${fmtDate(last.data)}) focou ${GROUPS[lastTop].label.toLowerCase()}.`;
  return { foco: k, win, why };
}

const FOCOS = { core: "Core", sup: "Superiores", pernas: "Pernas", corpo: "Corpo todo", cardio: "Fôlego" };

const wOf = (id) => { const w = W[id] || [0, 0, 0, 0]; return { core: w[0], sup: w[1], pernas: w[2], cardio: w[3] }; };

function choose(filter, score, used, r) {

  const coolOf = (n) => pickN(Object.values(LIB).filter((e) => e.cool && usable(e, local) && !used.has(e.id)), n).map((e) => item(e, local));
  const last2 = sorted().slice(0, 2);
  const considered = last2.length ? `Considerei seus últimos treinos: ${last2.map((w) => `${esc(w.titulo || "treino")} (${fmtDate(w.data)})`).join(" e ")}.` : "";

  if (estado === "dor") {

      aviso: "Com febre, dor no peito, falta de ar fora do normal ou tontura, não treine e procure atendimento.",
      partes: [
        { tipo: "wod", nome: "Circuito leve · 15 min", formato: "flow", min: 15, regra: "2 a 3 voltas sem pressa, respirando pelo nariz.", itens: ids.map((id) => item(LIB[id], local, { factor: 0.7 })) },
        { tipo: "cool", nome: "Volta à calma · 3 min", itens: coolOf(2) },

function persist() { LS.set("cg.brief", S.brief); LS.set("cg.plan2", S.plan); LS.set("cg.timer2", S.timer); LS.set("cg.reg", S.reg); }

document.addEventListener("click", async (ev) => {

    const strength = p.partes.find((x) => x.tipo === "strength");
    if (strength && Number(S.reg.forca) > 0) cargas[strength.itens[0].id] = Number(S.reg.forca);
    const wod = p.partes.find((x) => x.tipo === "wod");

  }
  if (act === "add-manual") { S.addMode = "manual"; S.draft = { data: todayISO(), titulo: "", texto: "", movimentos: [] }; S.msg = ""; render(); return; }
  if (act === "cancelar-draft") { S.addMode = null; S.draft = null; render(); return; }

  const b = S.plan.partes.find((x) => x.tipo === "wod"); if (!b || b.formato === "flow") return;
  const cs = clockState(b);
  const c = document.getElementById("clk"), sub = document.getElementById("clksub");
  if (c) c.textContent = cs.txt; if (sub) sub.textContent = cs.sub;
  highlightCurrent();
}, 250);
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

render();
initCapabilities();
window.CG = { LIB, FIG, stepSVG, generate, S };
</script>
