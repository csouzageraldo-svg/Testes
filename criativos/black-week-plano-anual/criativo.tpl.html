<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Michroma&display=swap" rel="stylesheet">
<style>
  :root { --y: #FFD400; --y2: #F2B705; --g: #8a6a00; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: #0b0b0b; overflow: hidden; }
  body { position: relative; font-family: 'Montserrat', sans-serif; color: #fff; }

  /* paw watermark shapes like the reference */
  .bgpaw { position: absolute; border-radius: 50%; background: #161616; }

  .photo { position: absolute; left: 0; top: 120px; width: 1080px; height: 1350px;
           background: url(assets/pets.png) center top / 1080px auto no-repeat; }
  .fade-top { position: absolute; left: 0; top: 0; width: 100%; height: 560px;
              background: linear-gradient(#0b0b0b 0%, #0b0b0b 42%, rgba(11,11,11,0) 100%); }
  .fade-bot { position: absolute; left: 0; bottom: 0; width: 100%; height: 300px;
              background: linear-gradient(rgba(11,11,11,0), rgba(11,11,11,.85) 55%, #0b0b0b 100%); }

  .logo-black { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); width: 270px; }
  .kicker { position: absolute; top: 140px; width: 100%; text-align: center;
            font-weight: 700; font-size: 40px; letter-spacing: .5px; color: #e9e9e9; }
  .headline { position: absolute; top: 186px; width: 100%; text-align: center;
              font-weight: 800; font-size: 134px; line-height: 1; letter-spacing: -3px; white-space: nowrap; }
  .headline .gold { font-weight: 900;
    background: linear-gradient(100deg, #FFE14A 0%, var(--y) 35%, #E5A800 70%, #7d5c00 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }

  .plus { position: absolute; top: 340px; left: 50%; transform: translateX(-50%);
          display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .plus .and { font-weight: 900; font-size: 46px; color: var(--y); }
  .plus .pill { background: var(--y); color: #0b0b0b; font-weight: 800; font-size: 34px;
                padding: 12px 26px 12px 20px; border-radius: 999px; display: flex; align-items: center; gap: 12px;
                box-shadow: 0 0 40px rgba(255,212,0,.35); }
  .plus .pill svg { width: 34px; height: 34px; }

  .week { position: absolute; top: 432px; width: 100%; text-align: center;
          font-family: 'Michroma', sans-serif; font-size: 25px; letter-spacing: 9px; color: #d7d7d7; }

  /* GPS pulse rings around the collar tag */
  .rings { position: absolute; left: var(--tx); top: var(--ty); width: 0; height: 0; }
  .rings span { position: absolute; border: 3px solid var(--y); border-radius: 50%;
                transform: translate(-50%, -50%); }
  .rings span:nth-child(1) { width: 150px; height: 150px; opacity: .95; }
  .rings span:nth-child(2) { width: 220px; height: 220px; opacity: .55; border-width: 2px; }
  .rings span:nth-child(3) { width: 300px; height: 300px; opacity: .28; border-width: 2px; }

  /* callout pointing at the tag */
  .callout { position: absolute; left: var(--cx); top: var(--cy); width: 300px;
             background: rgba(11,11,11,.82); border: 2px solid var(--y); border-radius: 22px;
             padding: 18px 22px; backdrop-filter: blur(6px); }
  .callout .t1 { font-weight: 900; font-size: 30px; line-height: 1.05; color: var(--y); }
  .callout .t2 { margin-top: 6px; font-weight: 600; font-size: 19px; line-height: 1.25; color: #eee; }
  .callout .tagico { display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
                     font-weight: 800; font-size: 16px; letter-spacing: 2px; color: #fff; }
  .callout .tagico svg { width: 26px; height: 26px; }
  .leader { position: absolute; height: 3px; background: var(--y); transform-origin: 0 50%; }
  .leader::after { content: ""; position: absolute; right: -7px; top: -6px; width: 15px; height: 15px;
                   border-radius: 50%; background: var(--y); }

  /* stamp badge */
  .stamp { position: absolute; right: 52px; top: 540px; width: 190px; height: 190px; border-radius: 50%;
           background: var(--y); color: #0b0b0b; display: flex; flex-direction: column; align-items: center;
           justify-content: center; transform: rotate(10deg); text-align: center;
           box-shadow: 0 0 0 7px #0b0b0b, 0 0 0 10px var(--y), 0 18px 50px rgba(0,0,0,.6); }
  .stamp .s1 { font-weight: 800; font-size: 19px; letter-spacing: 1px; }
  .stamp .s2 { font-weight: 900; font-size: 64px; line-height: .9; letter-spacing: -2px; }
  .stamp .s3 { font-weight: 900; font-size: 23px; line-height: 1; }

  .logo-pet { position: absolute; left: 42px; bottom: 34px; width: 190px; }
  .legal { position: absolute; right: 48px; bottom: 50px; width: 720px; text-align: right;
           font-weight: 600; font-size: 19px; line-height: 1.35; letter-spacing: .3px; color: #e3e3e3; }
  .legal b { color: var(--y); font-weight: 800; }
</style></head>
<body>
  <div class="bgpaw" style="left:-120px;top:120px;width:520px;height:520px"></div>
  <div class="bgpaw" style="right:-160px;top:-60px;width:460px;height:460px"></div>

  <div class="photo"></div>
  <div class="fade-top"></div>
  <div class="fade-bot"></div>

  <img class="logo-black" src="assets/black_logo.png">
  <div class="kicker">O MELHOR PLANO PET COM:</div>
  <div class="headline">5 MESES <span class="gold">GRÁTIS</span></div>
  <div class="plus">
    <span class="and">+</span>
    <span class="pill">
      <svg viewBox="0 0 24 24" fill="#0b0b0b"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      GANHE UMA TAG DE RASTREAMENTO
    </span>
  </div>
  <div class="week">SÓ NA SEMANA DA BLACK</div>

  <div class="rings" style="--tx:__TX__px;--ty:__TY__px"><span></span><span></span><span></span></div>
  <div class="leader" style="left:__LX__px;top:__LY__px;width:__LW__px;transform:rotate(__LA__deg)"></div>
  <div class="callout" style="--cx:__CX__px;--cy:__CY__px">
    <div class="tagico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFD400" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3" fill="#FFD400"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a4.5 4.5 0 0 0 0 7M15.5 8.5a4.5 4.5 0 0 1 0 7"/></svg>
      DE BRINDE
    </div>
    <div class="t1">TAG +PET<br>NA COLEIRA</div>
    <div class="t2">Saiba onde seu pet está, a qualquer hora.</div>
  </div>

  <div class="stamp"><div class="s2">12</div><div class="s3">MESES</div><div class="s1">PAGUE SÓ 7</div></div>

  <img class="logo-pet" src="assets/pet_logo.png">
  <div class="legal">*OFERTA VÁLIDA <b>SOMENTE NO PLANO ANUAL</b>, NESTA SEMANA<br>(SEMANA DA BLACK).</div>
</body></html>
