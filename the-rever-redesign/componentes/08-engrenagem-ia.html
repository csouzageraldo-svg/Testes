<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engrenagem de IA · Componente The Rever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══ BASE THE REVER — copiar UMA vez para o <head> do site ══ */
:root{--ink:#141414;--ink-2:#1b1b1a;--ink-3:#242422;--paper:#f7f4ef;--sand:#e8dfd0;--mute:#8a8a8a;--mute-2:#5c5c58;--led:#168e7a;--led-bright:#1fae95;--teal:#5fd3bc;--hair:rgba(247,244,239,.12);--sg:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sg);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:90px 6vw}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.eyebrow .dot{color:var(--led)}
h1,h2,h3{font-weight:500;letter-spacing:-.02em;line-height:1.06;text-wrap:balance}
.section-head{display:flex;flex-direction:column;gap:18px;margin-bottom:64px}
.section-head h2{font-size:clamp(34px,4.6vw,58px);max-width:18ch}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:16px 30px;border-radius:2px;display:inline-block;transition:background .35s var(--ease),color .35s,border-color .35s;cursor:pointer}
.btn-solid{background:var(--paper);color:var(--ink);border:1px solid var(--paper)}
.btn-solid:hover,.btn-solid:focus-visible{background:var(--led);border-color:var(--led);color:var(--paper)}
.btn-ghost{color:var(--mute);border:1px solid transparent;padding-left:0}
.btn-ghost:hover{color:var(--paper)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
/* ══ FIM DA BASE ══ */

/* ── CSS DO COMPONENTE: Engrenagem de IA ── */
.ia-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;align-items:center}
.ia-gear{aspect-ratio:1;max-width:340px;position:relative;margin:0 auto;width:100%}
.ia-gear canvas{position:absolute;inset:0;width:100%;height:100%}
.ia-grid h2{font-size:clamp(30px,3.8vw,48px);margin-bottom:22px}
.ia-grid p.body{color:var(--mute);max-width:52ch}
@media (max-width:860px){.ia-grid{grid-template-columns:1fr}.ia-gear{max-width:260px}}
</style>
</head>
<body>

<!-- ══ MARKUP DO COMPONENTE: Engrenagem de IA ══ -->
<section class="wrap ia-grid">
  <div class="ia-gear rv" aria-hidden="true"><canvas id="gear-ia"></canvas></div>
  <div>
    <p class="eyebrow rv">A engrenagem</p>
    <h2 class="rv d1" style="margin-top:18px">A IA faz o pesado. O método decide.</h2>
    <p class="body rv d2">Dentro do motor, a IA é engrenagem: antecipa cancelamento antes do pedido, lê sinal de expansão na base, modela preço e recupera pagamento. Nunca é manchete. É o que trabalha enquanto o board dorme.</p>
  </div>
</section>
<!-- ══ FIM DO MARKUP ══ -->

<script>
/* Reveal on scroll — copiar UMA vez (ou substituir pelo seu GSAP ScrollTrigger) */
(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.18,rootMargin:'0px 0px -6% 0px'});document.querySelectorAll('.rv').forEach(function(el){io.observe(el)})})();
</script>
<script>
(function(){
var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setupCanvas(cv){
  var dpr=Math.min(devicePixelRatio||1,2);
  function resize(){var r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr}
  resize();addEventListener('resize',resize);
  return {ctx:cv.getContext('2d'),dpr:dpr};
}
function drawGear(ctx,g,rot,alpha,color,lw){
  var teeth=Math.max(8,Math.round(g.r/7)),depth=Math.max(4,g.r*0.09);
  ctx.save();ctx.translate(g.x,g.y);ctx.rotate(rot);ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=lw;
  ctx.beginPath();
  var steps=teeth*8;
  for(var i=0;i<=steps;i++){
    var a=(i/steps)*Math.PI*2,sq=Math.sin(a*teeth);
    var rr=g.r+(sq>0.35?depth:0)-depth/2;
    if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,g.r*0.62,0,Math.PI*2);ctx.stroke();
  for(var s=0;s<3;s++){var sa=s*(Math.PI*2/3);
    ctx.beginPath();ctx.moveTo(Math.cos(sa)*g.r*0.16,Math.sin(sa)*g.r*0.16);ctx.lineTo(Math.cos(sa)*g.r*0.60,Math.sin(sa)*g.r*0.60);ctx.stroke();}
  ctx.beginPath();ctx.arc(0,0,g.r*0.10,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
var iaCv=document.getElementById('gear-ia');
if(iaCv){
  var I=setupCanvas(iaCv);
  function iaFrame(t){
    var w=iaCv.width/I.dpr,h=iaCv.height/I.dpr,ctx=I.ctx;
    ctx.setTransform(I.dpr,0,0,I.dpr,0,0);ctx.clearRect(0,0,w,h);
    var g={x:w/2,y:h/2,r:Math.min(w,h)*0.34};
    drawGear(ctx,g,reduced?0.4:t*0.00012,0.9,'#168e7a',1.4);
    ctx.save();ctx.globalAlpha=0.25;ctx.strokeStyle='#8a8a8a';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(w*1.06,h*0.2,Math.min(w,h)*0.5,0,Math.PI*2);ctx.stroke();ctx.restore();
    if(!reduced)requestAnimationFrame(iaFrame);
  }
  requestAnimationFrame(iaFrame);
}
})();
</script>
</body>
</html>
