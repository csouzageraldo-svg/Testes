<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faixa de Logos · Componente The Rever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══ BASE THE REVER — copiar UMA vez para o <head> do site ══ */
:root{--ink:#141414;--ink-2:#1b1b1a;--ink-3:#242422;--paper:#f7f4ef;--sand:#e8dfd0;--mute:#8a8a8a;--mute-2:#5c5c58;--led:#168e7a;--led-bright:#1fae95;--teal:#5fd3bc;--hair:rgba(247,244,239,.12);--sg:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sg);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:90px 6vw}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.eyebrow .dot{color:var(--led)}
h1,h2,h3{font-weight:500;letter-spacing:-.02em;line-height:1.06;text-wrap:balance}
.section-head{display:flex;flex-direction:column;gap:18px;margin-bottom:64px}
.section-head h2{font-size:clamp(34px,4.6vw,58px);max-width:18ch}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:16px 30px;border-radius:2px;display:inline-block;transition:background .35s var(--ease),color .35s,border-color .35s;cursor:pointer}
.btn-solid{background:var(--paper);color:var(--ink);border:1px solid var(--paper)}
.btn-solid:hover,.btn-solid:focus-visible{background:var(--led);border-color:var(--led);color:var(--paper)}
.btn-ghost{color:var(--mute);border:1px solid transparent;padding-left:0}
.btn-ghost:hover{color:var(--paper)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
/* ══ FIM DA BASE ══ */

/* ── CSS DO COMPONENTE: Faixa de Logos ── */
.logoband{border-top:1px solid var(--hair)}
.logoband .band{padding:38px 0}
.logoband .band.dim{background:var(--ink-2);border-bottom:1px solid var(--hair)}
.band-in{max-width:1320px;margin:0 auto;padding:0 4vw;display:flex;align-items:center;justify-content:center;gap:clamp(18px,2.6vw,42px);flex-wrap:wrap}
.band-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.lg{color:#9a9a94;opacity:.85;display:flex;align-items:center;gap:6px}
.lg img{height:26px;width:auto;filter:grayscale(1) brightness(1.4);opacity:.8}
.lg svg{display:block;fill:#9a9a94;stroke:#9a9a94}
.lg-tim b{font-weight:700;font-size:19px}
.lg-oi{width:34px;height:34px;border:2.5px solid #9a9a94;border-radius:50%;justify-content:center;font-weight:700;font-size:14px}
.lg-sky b{font-weight:700;font-style:italic;font-size:22px;letter-spacing:-.03em}
.lg-nextel b{font-weight:700;font-size:19px}
.lg-wine b{font-weight:500;font-size:18px;letter-spacing:.22em}
.lg-cetrus i{width:10px;height:10px;background:#9a9a94;transform:rotate(45deg);display:inline-block}
.lg-cetrus b{font-weight:500;font-size:18px;text-transform:lowercase}
.lg-pet{width:38px;height:38px;border:1.5px solid #9a9a94;border-radius:50%;justify-content:center;font-weight:700;font-size:12px}
.lg-sanar b{font-weight:700;font-size:19px;text-transform:lowercase}
.lg-usp b{font-weight:700;font-size:27px;color:transparent;-webkit-text-stroke:1.4px #9a9a94}
.lg-singularity b{font-weight:700;font-style:italic;font-size:27px}
</style>
</head>
<body>

<!-- ══ MARKUP DO COMPONENTE: Faixa de Logos ══ -->
<!-- PRODUÇÃO: troque cada <span class="lg ..."> por <span class="lg"><img src="caminho/logo.png" alt="Nome"></span>
     usando os PNGs de the-rever-design-system/logos/png -->
<div class="logoband rv">
  <div class="band dim">
    <div class="band-in">
      <span class="band-label">Construído dentro de operações como</span>
      <span class="lg lg-tim"><svg width="24" height="17" viewBox="0 0 24 17"><rect y="0" width="16" height="3.2" rx="1"/><rect y="6.8" width="24" height="3.2" rx="1"/><rect y="13.6" width="16" height="3.2" rx="1"/></svg><b>TIM</b></span>
      <span class="lg lg-oi"><b>oi</b></span>
      <span class="lg lg-sky"><b>SKY</b></span>
      <span class="lg lg-nextel"><b>nextel</b></span>
      <span class="lg lg-wine"><b>WINE</b></span>
      <span class="lg lg-cetrus"><i></i><b>cetrus</b></span>
      <span class="lg lg-pet"><b>+Pet</b></span>
      <span class="lg lg-sanar"><b>sanar</b></span>
    </div>
  </div>
  <div class="band">
    <div class="band-in">
      <span class="band-label">Formação e ecossistema</span>
      <span class="lg lg-mit"><svg width="52" height="26" viewBox="0 0 52 26"><rect x="0" y="0" width="7" height="26"/><rect x="10" y="0" width="7" height="17"/><rect x="20" y="0" width="7" height="26"/><rect x="30" y="9" width="7" height="17"/><rect x="40" y="0" width="7" height="26"/><rect x="30" y="0" width="7" height="5"/></svg></span>
      <span class="lg lg-usp"><b>USP</b></span>
      <span class="lg lg-singularity"><b>S</b></span>
    </div>
  </div>
</div>
<!-- ══ FIM DO MARKUP ══ -->

<script>
/* Reveal on scroll — copiar UMA vez (ou substituir pelo seu GSAP ScrollTrigger) */
(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.18,rootMargin:'0px 0px -6% 0px'});document.querySelectorAll('.rv').forEach(function(el){io.observe(el)})})();
</script>

</body>
</html>
